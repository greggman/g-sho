name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pushes queue up behind a running build rather than cancel it (it may be
  # publishing new dictionary data); pull requests just need the newest run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # to publish a data release
      contents: write
    steps:
      # With g-sho-data, our copy of the sources and models: builds use only
      # it, never the sites they come from. New sources are downloaded and
      # committed there by hand (npm run download; see README.md).
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # The dictionary data is the "data-<key>" release, the key a hash of
      # the g-sho-data commit and the data build's code (scripts/data-key.ts).
      # A push that changes either builds it; any other push reuses it, so
      # its data doesn't change (and devices that saved it for offline use
      # don't download it again; unchanged files keep their versions anyway).
      - name: Find the dictionary data
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(node scripts/data-key.ts)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Using dictionary data from $tag"
          else
            echo "Building dictionary data $tag"
          fi

      - name: Use the published dictionary data
        if: steps.data.outputs.published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.data.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern data.tar.gz
          mkdir -p dist
          tar -xzf data.tar.gz -C dist
          rm data.tar.gz

      - name: Get the handwriting and OCR models from g-sho-data
        if: steps.data.outputs.published
        run: node scripts/download.ts --models --offline

      - name: Get the dictionary sources and the models from g-sho-data
        if: ${{ !steps.data.outputs.published }}
        run: node scripts/download.ts --offline

      # For the WebAssembly kernels (src/wasm/nn.rs).
      - run: rustup target add wasm32-unknown-unknown

      - name: Build the dictionary data
        if: ${{ !steps.data.outputs.published }}
        run: npm run build:data

      - run: npm run build
      - run: npm test

      # New data is published once the tests pass, for the builds after it.
      - name: Publish the dictionary data
        if: ${{ !steps.data.outputs.published && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.data.outputs.tag }}
        run: |
          tar -czf data.tar.gz -C dist data
          gh release create "$TAG" data.tar.gz --latest=false \
            --title "Dictionary data $(date -u +%Y-%m-%d) ($TAG)" \
            --notes "The built dictionary data (dist/data): JMdict $(node -p "require('./dist/data/meta.json').dictDate"), from g-sho-data $(git rev-parse --short HEAD:g-sho-data), built by g-sho $(git rev-parse --short HEAD). Builds whose data key (scripts/data-key.ts) is ${TAG#data-} use it."
          rm data.tar.gz

      # One tarball uploads much faster than ~12,500 separate files.
      - name: Pack the site
        if: github.event_name != 'pull_request'
        run: tar -czf site.tgz dist

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site.tgz
          retention-days: 1

  # Uploads the site and the Worker (src/server) to Cloudflare. Only main
  # gets the production environment, and only it can read the API token.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://g-sho.org
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: site

      - run: tar -xzf site.tgz

      # Database changes go first, so the new code never sees an old schema.
      # Migrations only add things, so the code still running meanwhile is fine.
      - run: npx wrangler d1 migrations apply DB --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: npx wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
