name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # jmdict-simplified publishes new dictionary data weekly; rebuild to pick it up.
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      - name: Download dictionary data and handwriting model
        run: npm run download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # For the WebAssembly kernels (src/wasm/nn.rs).
      - run: rustup target add wasm32-unknown-unknown

      - run: npm run build:data
      - run: npm run build
      - run: npm test

      # One tarball uploads much faster than ~12,500 separate files.
      - name: Pack the site
        if: github.event_name != 'pull_request'
        run: tar -czf site.tgz dist

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site.tgz
          retention-days: 1

  # Uploads the site and the Worker (src/server) to Cloudflare. Only main
  # gets the production environment, and only it can read the API token.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://g-sho.org
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: site

      - run: tar -xzf site.tgz

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
