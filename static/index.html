<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>g-sho — Japanese dictionary</title>
    <meta
      name="description"
      content="A Japanese-English dictionary. Search in English, Japanese, or romaji."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./" aria-label="g-sho home"
        ><span class="logo-mark" lang="ja">書</span><span class="logo-text">g-sho</span></a
      >
      <form id="search-form" class="search" role="search">
        <input
          id="q"
          name="q"
          type="search"
          lang="ja"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="English, 日本語, or romaji"
          aria-label="Search"
          autofocus
        />
        <button
          id="handwriting-toggle"
          type="button"
          class="radical-toggle icon-button"
          title="Draw a character (手書き)"
          aria-label="Draw a character"
          aria-expanded="false"
          aria-controls="handwriting-panel"
        >
          <!-- a pencil writing a stroke -->
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M14.5 4.5l3 3L8 17l-4 1 1-4z M12.5 6.5l3 3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <path
              d="M13 20.5c2-1.5 3.5-1.5 4.5-.5s2.5 1 3.5-.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          id="radical-toggle"
          type="button"
          class="radical-toggle icon-button"
          title="Search by radical (部首)"
          aria-label="Search by radical"
          aria-expanded="false"
          aria-controls="radical-panel"
        >
          <!-- a character's parts: a tall left part and two on the right -->
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3.5" y="3.5" width="7" height="17" rx="1.5" />
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
              <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
            </g>
          </svg>
        </button>
        <button
          id="settings-toggle"
          type="button"
          class="radical-toggle icon-button"
          title="Settings"
          aria-label="Settings"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          <!-- a gear -->
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </g>
          </svg>
        </button>
        <button type="submit" class="search-button" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2" />
            <path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
      </form>
    </header>
    <div id="handwriting-panel" class="radical-panel" hidden></div>
    <div id="radical-panel" class="radical-panel" hidden></div>
    <div id="settings-panel" class="radical-panel" hidden></div>
    <main id="content" class="content" aria-live="polite">
      <noscript>This dictionary needs JavaScript to search.</noscript>
    </main>
